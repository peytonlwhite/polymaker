name: Test suite

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install sanitized CI settings
        shell: pwsh
        run: |
          Copy-Item .github/test-fixtures/bot_settings.ci.json bot_settings.json
          Copy-Item .github/test-fixtures/crypto_settings.ci.json crypto_settings.json

      - name: Compile source
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -p "test_*.py"
